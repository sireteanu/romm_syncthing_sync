---
services:
  romm-sync:
    image: ghcr.io/sireteanu/romm_syncthing_sync:latest
    container_name: romm-sync
    restart: unless-stopped
    env_file: .env.example
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"   # web dashboard -> http://<server>:8080
    volumes:
    # do NOT change the container side of these. Update the variables in .env.
    # The /syncdata/... bind mounts are hardcoded in the container.
    # Sync folders are mounted read-write so RomM -> folder sync can work.
    # Add ":ro" to the end of them if you only ever want folder -> RomM (and set PULL_MODE=off).
      # - ${ALL_SYNC_FOLDER}:/syncdata  # Uncomment if saves and states are in the same folder.
      - ${SAVE_SYNC_FOLDER}:/syncdata/saves
      - ${STATE_SYNC_FOLDER}:/syncdata/states
      - ${DATA_FOLDER:-./data}:/data   # sync history, pending approvals and backups
